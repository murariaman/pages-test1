<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      padding: 40px 50px;
      border-radius: 16px;
      max-width: 480px;
      margin: 20px;
    }
    h1 { font-size: 2.4rem; margin: 0 0 12px; }
    p { font-size: 1.1rem; line-height: 1.5; margin: 8px 0; }
    #time { font-weight: bold; }
    button {
      margin-top: 18px;
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      color: #1e3c72;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>It works!</h1>
    <p>If you can read this, your site is live on GitHub Pages.</p>
    <p>This page was opened at: <span id="time"></span></p>
    <button onclick="document.getElementById('msg').textContent = 'JavaScript is working too!'">
      Click me
    </button>
    <p id="msg"></p>
  </div>

  <script>
    document.getElementById('time').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
